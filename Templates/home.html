<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aswob Gloub</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e5e5e5; font-family: -apple-system, sans-serif; min-height: 100vh; padding-bottom: 80px; }
.topbar { position: sticky; top: 0; background: rgba(10,10,15,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #1f1f2e; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
.logo { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.topbar button { background: none; border: 1px solid #333; color: #aaa; padding: 6px 12px; border-radius: 8px; font-size: 13px; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.composer { background: #13131c; border: 1px solid #1f1f2e; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.composer textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; resize: none; outline: none; font-family: inherit; min-height: 60px; }
.composer .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.composer label { color: #06b6d4; font-size: 13px; cursor: pointer; }
.composer input[type=file] { display: none; }
.composer button { background: linear-gradient(90deg, #a855f7, #06b6d4); border: none; color: #fff; padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
.post { background: #13131c; border: 1px solid #1f1f2e; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #06b6d4); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
.post-head .user { font-weight: bold; font-size: 14px; }
.post-head .time { font-size: 11px; color: #666; }
.post-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.post-image { width: 100%; border-radius: 10px; margin-top: 10px; }
.post-actions { display: flex; gap: 18px; margin-top: 12px; font-size: 14px; color: #888; }
.post-actions span { cursor: pointer; }
.post-actions .liked { color: #f43f5e; }
.comments { margin-top: 10px; padding-top: 10px; border-top: 1px solid #1f1f2e; font-size: 13px; }
.comments .c { margin-bottom: 6px; color: #aaa; }
.comments .c b { color: #06b6d4; }
.comment-input { display: flex; gap: 8px; margin-top: 8px; }
.comment-input input { flex: 1; background: #0a0a0f; border: 1px solid #1f1f2e; border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 13px; outline: none; }
.comment-input button { background: #a855f7; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); border-top: 1px solid #1f1f2e; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
.nav button { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav button.active { color: #a855f7; }
.nav .icon { font-size: 20px; }
.search { background: #13131c; border: 1px solid #1f1f2e; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
.search input { width: 100%; background: transparent; border: none; color: #fff; outline: none; font-size: 14px; }
</style>
</head>
<body>
<div class="topbar">
    <div class="logo">Aswob Gloub</div>
    <button onclick="logout()">Keluar</button>
</div>
<div class="container">
    <div id="view-feed">
        <div class="composer">
            <textarea id="post-content" placeholder="Apa yang kamu pikirkan?"></textarea>
            <div class="row">
                <label for="post-image">📷 Gambar</label>
                <input type="file" id="post-image" accept="image/*">
                <button onclick="submitPost()">Posting</button>
            </div>
        </div>
        <div class="search"><input id="search" placeholder="🔍 Cari user..." oninput="doSearch()"></div>
        <div id="search-results"></div>
        <div id="feed"></div>
    </div>
    <div id="view-profile" style="display:none;">
        <div id="profile-content"></div>
    </div>
</div>
<div class="nav">
    <button class="active" onclick="showView('feed')"><span class="icon">🏠</span><span>Feed</span></button>
    <button onclick="showView('profile')"><span class="icon">👤</span><span>Profil</span></button>
</div>
<script>
const token = localStorage.getItem("token");
const myUser = localStorage.getItem("username");
if (!token) location.href = "/";
function headers(json = true) {
    const h = {"Authorization": "Bearer " + token};
    if (json) h["Content-Type"] = "application/json";
    return h;
}
async function submitPost() {
    const content = document.getElementById("post-content").value.trim();
    const file = document.getElementById("post-image").files[0];
    if (!content && !file) return;
    const fd = new FormData();
    fd.append("content", content);
    if (file) fd.append("image", file);
    await fetch("/api/post", { method: "POST", headers: {"Authorization": "Bearer " + token}, body: fd });
    document.getElementById("post-content").value = "";
    document.getElementById("post-image").value = "";
    loadFeed();
}
async function loadFeed() {
    const r = await fetch("/api/posts", {headers: headers(false)});
    const posts = await r.json();
    document.getElementById("feed").innerHTML = posts.map(renderPost).join("") || '<p style="text-align:center;color:#666">Belum ada post</p>';
}
function renderPost(p) {
    const initial = p.username[0].toUpperCase();
    const time = new Date(p.created).toLocaleString("id-ID");
    const img = p.image ? `<img class="post-image" src="/uploads/${p.image}">` : "";
    return `<div class="post" data-id="${p.id}">
        <div class="post-head">
            <div class="avatar">${initial}</div>
            <div><div class="user" onclick="viewUser('${p.username}')" style="cursor:pointer">${p.username}</div><div class="time">${time}</div></div>
        </div>
        <div class="post-content">${escapeHtml(p.content)}</div>${img}
        <div class="post-actions">
            <span class="${p.liked ? 'liked' : ''}" onclick="likePost(${p.id})">❤ ${p.likes}</span>
            <span onclick="toggleComments(${p.id})">💬 ${p.comments}</span>
        </div>
        <div class="comments" id="comments-${p.id}" style="display:none;">
            <div id="clist-${p.id}"></div>
            <div class="comment-input"><input placeholder="Tulis komentar..." id="cinput-${p.id}"><button onclick="submitComment(${p.id})">Kirim</button></div>
        </div>
    </div>`;
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function likePost(id) { await fetch("/api/like/" + id, {method:"POST", headers: headers(false)}); loadFeed(); }
async function toggleComments(id) {
    const box = document.getElementById("comments-" + id);
    box.style.display = box.style.display === "none" ? "block" : "none";
    if (box.style.display === "block") loadComments(id);
}
async function loadComments(id) {
    const r = await fetch("/api/comments/" + id);
    const cs = await r.json();
    document.getElementById("clist-" + id).innerHTML = cs.map(c => `<div class="c"><b>${c.username}</b>: ${escapeHtml(c.content)}</div>`).join("");
}
async function submitComment(id) {
    const inp = document.getElementById("cinput-" + id);
    const c = inp.value.trim();
    if (!c) return;
    await fetch("/api/comment/" + id, {method:"POST", headers: headers(), body: JSON.stringify({content: c})});
    inp.value = "";
    loadComments(id);
    loadFeed();
}
async function doSearch() {
    const q = document.getElementById("search").value.trim();
    const box = document.getElementById("search-results");
    if (!q) { box.innerHTML = ""; return; }
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const users = await r.json();
    box.innerHTML = users.map(u => `<div class="post" style="padding:10px 14px;cursor:pointer" onclick="viewUser('${u.username}')"><b>${u.username}</b> <span style="color:#666;font-size:13px">${escapeHtml(u.bio || "")}</span></div>`).join("");
}
async function viewUser(username) {
    showView("profile");
    const r = await fetch("/api/user/" + username);
    const d = await r.json();
    const u = d.user;
    const posts = d.posts.map(p => renderPost({...p, username: u.username, likes: p.likes||0, liked: p.liked||false, comments: p.comments||0})).join("");
    document.getElementById("profile-content").innerHTML = `
        <div class="post" style="text-align:center;padding:24px">
            <div class="avatar" style="margin:0 auto 12px;width:72px;height:72px;font-size:28px">${u.username[0].toUpperCase()}</div>
            <h2>${u.username}</h2>
            <p style="color:#888;margin-top:6px">${escapeHtml(u.bio || "Belum ada bio")}</p>
        </div>${posts || "<p style='text-align:center;color:#666'>Belum ada post</p>"}`;
}
async function myProfile() {
    const r = await fetch("/api/user/" + myUser);
    const d = await r.json();
    const u = d.user;
    const posts = d.posts.map(p => renderPost({...p, username: u.username, likes: p.likes||0, liked: p.liked||false, comments: p.comments||0})).join("");
    document.getElementById("profile-content").innerHTML = `
        <div class="post" style="text-align:center;padding:24px">
            <div class="avatar" style="margin:0 auto 12px;width:72px;height:72px;font-size:28px">${u.username[0].toUpperCase()}</div>
            <h2>${u.username}</h2>
            <p style="color:#888;margin-top:6px">${escapeHtml(u.bio || "Belum ada bio")}</p>
            <button onclick="editBio()" style="margin-top:14px;background:#a855f7;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer">Edit Bio</button>
        </div>${posts || "<p style='text-align:center;color:#666'>Belum ada post</p>"}`;
}
async function editBio() {
    const bio = prompt("Bio baru:");
    if (bio === null) return;
    await fetch("/api/bio", {method:"POST", headers: headers(), body: JSON.stringify({bio})});
    myProfile();
}
function showView(v) {
    document.getElementById("view-feed").style.display = v === "feed" ? "block" : "none";
    document.getElementById("view-profile").style.display = v === "profile" ? "block" : "none";
    document.querySelectorAll(".nav button").forEach((b, i) => {
        b.classList.toggle("active", (v === "feed" && i === 0) || (v === "profile" && i === 1));
    });
    if (v === "profile") myProfile();
}
function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    location.href = "/";
}
loadFeed();
</script>
</body>
</html>
