<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aswob Gloub</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #1a0033, #000d1a); color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { max-width: 400px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
h1 { text-align: center; font-size: 32px; background: linear-gradient(90deg, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
.tag { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
input { width: 100%; padding: 14px; margin-bottom: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
input:focus { border-color: #a855f7; }
button { width: 100%; padding: 14px; background: linear-gradient(90deg, #a855f7, #06b6d4); border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
.toggle { text-align: center; margin-top: 18px; color: #888; font-size: 14px; }
.toggle a { color: #06b6d4; cursor: pointer; }
#msg { text-align: center; margin-top: 12px; font-size: 13px; min-height: 20px; color: #f87171; }
</style>
</head>
<body>
<div class="card">
    <h1>Aswob Gloub</h1>
    <p class="tag" id="tagline">Masuk ke akun kamu</p>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="submit()" id="btn">Masuk</button>
    <div id="msg"></div>
    <p class="toggle">
        <span id="switch-text">Belum punya akun?</span>
        <a onclick="toggleMode()" id="switch-link">Daftar</a>
    </p>
</div>
<script>
let mode = "login";
function toggleMode() {
    mode = mode === "login" ? "register" : "login";
    document.getElementById("tagline").innerText = mode === "login" ? "Masuk ke akun kamu" : "Buat akun baru";
    document.getElementById("btn").innerText = mode === "login" ? "Masuk" : "Daftar";
    document.getElementById("switch-text").innerText = mode === "login" ? "Belum punya akun?" : "Sudah punya akun?";
    document.getElementById("switch-link").innerText = mode === "login" ? "Daftar" : "Masuk";
    document.getElementById("msg").innerText = "";
}
async function submit() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    if (!u || !p) { msg.innerText = "Isi semua field"; return; }
    const ep = mode === "login" ? "/api/login" : "/api/register";
    try {
        const r = await fetch(ep, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username: u, password: p})
        });
        const d = await r.json();
        if (d.ok) {
            localStorage.setItem("token", d.token);
            localStorage.setItem("username", d.username);
            location.href = "/home";
        } else msg.innerText = d.msg || "Gagal";
    } catch (e) { msg.innerText = "Server tidak aktif"; }
}
document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") submit();
});
</script>
</body>
</html>
